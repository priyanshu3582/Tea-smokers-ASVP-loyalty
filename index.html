
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tea Smokers Loyalty</title><style>
:root{--bg:#080808;--card:#151515;--orange:#ff6500;--yellow:#ffc400;--cream:#fff4df;--muted:#aaa;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#3b1a05,#080808 52%);font-family:Inter,Arial,sans-serif;color:#fff}.wrap{max-width:1100px;margin:auto;padding:20px}.brand{font-weight:950;font-size:34px}.brand b{color:var(--orange)}.tag{color:#bbb}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.nav button{background:#222;color:#fff}.nav .on,.btn{background:linear-gradient(90deg,var(--orange),var(--yellow));color:#111}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#151515ee;border:1px solid #41280e;border-radius:22px;padding:20px;box-shadow:0 16px 45px #0009}.hero{border-color:var(--orange)}input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:11px;padding:13px;margin:6px 0 13px}label{font-size:13px;color:#bbb}.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:16px 0}.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed #625100;color:#777;font-weight:900}.stamp.on{background:var(--orange);border-style:solid;color:#111}.reward{padding:15px;border-radius:14px;background:linear-gradient(135deg,#ff6500,#ffc400);color:#111;font-weight:950}.qr{width:250px;max-width:100%;background:#fff;padding:10px;border-radius:15px;display:block;margin:auto}.muted{color:var(--muted)}.big{font-size:28px;font-weight:950}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.notice{margin-top:12px;padding:12px;border-radius:12px;background:#102714;color:#c6ffd0}.bad{background:#351414;color:#ffc1bb}.stat{font-size:25px;font-weight:950}.small{font-size:12px;color:#aaa}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #333;text-align:left;font-size:13px}.camera{width:100%;max-width:480px;border-radius:16px;background:#000}.hide{display:none!important}
</style></head><body><div class="wrap">
<div class="brand">TEA <b>SMOKERS</b></div><div class="tag">ASVP ENTERPRISES • Scan • Sip • Collect • Redeem</div>
<div class="nav"><button id="nCustomer" class="on" onclick="page('customer')">My Card</button><button id="nJoin" onclick="page('join')">Join</button><button id="nStaff" onclick="page('staff')">Staff</button><button id="nAdmin" onclick="page('admin')">Dashboard</button></div>

<section id="customer" class="page on"><div id="customerRoot"></div></section>
<section id="join" class="page"><div class="card hero"><h2>Join Tea Smokers Loyalty ☕</h2><p class="muted">₹150 spent = 1 stamp • 10 stamps = ₹150 OFF</p><label>Name</label><input id="jname" placeholder="Manu"><label>WhatsApp / Mobile</label><input id="jphone" placeholder="6388159515" inputmode="numeric"><button class="btn" onclick="join()">Create My Card</button><div id="joinMsg"></div></div></section>

<section id="staff" class="page"><div class="grid">
<div class="card hero"><h2>Staff Login</h2><label>Username</label><input id="su" placeholder="admin"><label>Password</label><input id="sp" type="password" placeholder="••••••••"><button class="btn" onclick="login()">Login</button><div id="loginMsg"></div></div>
<div id="staffTools" class="card hide"><h2>Earn Stamps</h2><p class="muted">Scan the customer's QR or enter their number.</p><button class="btn" onclick="startScan()">📷 Scan Customer QR</button><video id="video" class="camera hide" playsinline></video><input id="sphone" placeholder="Customer mobile"><input id="bill" type="number" placeholder="Bill amount ₹450"><button class="btn" onclick="addStamps()">Add Stamps</button><div id="staffMsg"></div></div>
<div id="redeemTools" class="card hide"><h2>Redeem Reward</h2><input id="rphone" placeholder="Customer mobile"><button class="btn" onclick="redeem()">Redeem ₹150 OFF</button><div id="redeemMsg"></div></div>
</div></section>

<section id="admin" class="page"><div id="adminRoot" class="grid"></div></section>
</div>
<script>
const $=x=>document.getElementById(x), tokenKey='ts_staff_token';
function page(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(x).classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));$('n'+x[0].toUpperCase()+x.slice(1)).classList.add('on');if(x==='admin')stats()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(c){let s='';for(let i=1;i<=10;i++)s+=`<div class="stamp ${i<=c.stamps?'on':''}">${i<=c.stamps?'☕':i}</div>`;$('customerRoot').innerHTML=`<div class="grid"><div class="card hero"><div class="row"><div><div class="muted">WELCOME</div><div class="big">${esc(c.name)}</div><div class="muted">+91 ${c.phone}</div></div><div class="big">${c.stamps}/10</div></div><div class="stamps">${s}</div><div class="reward">${(c.rewards_earned>c.rewards_redeemed)?'🎁 ₹150 OFF AVAILABLE':'🎁 '+(10-c.stamps)+' more stamp(s) to unlock ₹150 OFF'}</div><p>₹150 spent = 1 stamp</p><button class="btn" onclick="document.getElementById('qbox').scrollIntoView()">Show My QR</button></div><div id="qbox" class="card"><h2>My QR</h2><img class="qr" src="/api/qr/${c.token}"><p class="muted">Show this at billing every visit.</p><a class="btn" href="/api/qr/${c.token}" download="tea-smokers-qr.png">Save QR</a><p>WhatsApp: <a style="color:#ffc400" href="https://wa.me/91${c.phone}">Chat with Tea Smokers</a></p></div></div>`}
async function join(){let r=await fetch('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('jname').value,phone:$('jphone').value})}),d=await r.json();if(!r.ok){$('joinMsg').innerHTML='<div class="notice bad">'+esc(d.error)+'</div>';return}history.replaceState({},'', '?customer='+d.customer.token);render(d.customer);page('customer');}
async function loadCustomer(t){let r=await fetch('/api/customer/'+t);if(r.ok){render(await r.json());page('customer')}else page('join')}
async function login(){let r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('su').value,password:$('sp').value})}),d=await r.json();if(!r.ok){$('loginMsg').innerHTML='<div class="notice bad">'+esc(d.error)+'</div>';return}localStorage.setItem(tokenKey,d.token);$('staffTools').classList.remove('hide');$('redeemTools').classList.remove('hide');$('loginMsg').innerHTML='<div class="notice">Logged in.</div>'}
function hdr(){return {'Authorization':'Bearer '+localStorage.getItem(tokenKey),'Content-Type':'application/json'}}
async function addStamps(){let r=await fetch('/api/admin/stamps',{method:'POST',headers:hdr(),body:JSON.stringify({phone:$('sphone').value,billAmount:$('bill').value})}),d=await r.json();$('staffMsg').innerHTML=`<div class="notice ${r.ok?'':'bad'}">${esc(r.ok?`${d.earned} stamp(s) added. ${d.customer.name}: ${d.customer.stamps}/10. ${d.rewardsUnlocked?'🎉 Reward unlocked!':''}`:d.error)}</div>`}
async function redeem(){let r=await fetch('/api/admin/redeem',{method:'POST',headers:hdr(),body:JSON.stringify({phone:$('rphone').value})}),d=await r.json();$('redeemMsg').innerHTML=`<div class="notice ${r.ok?'':'bad'}">${esc(r.ok?'₹150 OFF redeemed successfully. Remaining stamps: '+d.customer.stamps:d.error)}</div>`}
async function stats(){let r=await fetch('/api/admin/stats',{headers:hdr()});if(!r.ok){$('adminRoot').innerHTML='<div class="card">Please login in Staff first.</div>';return}let d=await r.json();$('adminRoot').innerHTML=`<div class="card"><div class="small">TOTAL CUSTOMERS</div><div class="stat">${d.all.customers}</div></div><div class="card"><div class="small">TODAY SALES</div><div class="stat">₹${d.today.sales}</div><div class="small">${d.today.visits} bills</div></div><div class="card"><div class="small">ALL-TIME SALES</div><div class="stat">₹${d.all.revenue}</div></div><div class="card"><div class="small">REWARDS EARNED</div><div class="stat">${d.all.rewards}</div></div>`}
async function startScan(){let v=$('video');v.classList.remove('hide');if(!('BarcodeDetector' in window)){alert('Camera QR scanning is not supported in this browser. Use mobile number search or a supported browser.');return}let detector=new BarcodeDetector({formats:['qr_code']});let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();let timer=setInterval(async()=>{try{let codes=await detector.detect(v);if(codes[0]){let u=new URL(codes[0].rawValue);let t=u.searchParams.get('customer');if(t){let r=await fetch('/api/customer/'+t);if(r.ok){let c=await r.json();$('sphone').value=c.phone;clearInterval(timer);stream.getTracks().forEach(x=>x.stop());v.classList.add('hide');}}}}catch(e){}},500)}
const p=new URLSearchParams(location.search);if(p.get('customer'))loadCustomer(p.get('customer'));if(localStorage.getItem(tokenKey)){$('staffTools').classList.remove('hide');$('redeemTools').classList.remove('hide')}
</script></body></html>
